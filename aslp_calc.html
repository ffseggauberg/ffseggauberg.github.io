    <style>
        /* Grundlegendes Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Hintergrund und allgemeine Schrift */
        body {
            font-family: 'Roboto', sans-serif;
            background-color: #f5f7fa;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100%;
            margin: 40px 0px 30px 0px;
        }

        .container {
            background-color: #fff;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 800px;
            text-align: center;
        }

        /* Start- und Endbildschirm */
        #start-screen {
            display: block;
        }

        #quiz-screen,
        #result-screen {
            display: none;
        }

        /* Überschriften */
        h1 {
            font-size: 4rem;
            color: #A72920;
            text-align: center;
        }

        h2 {
            font-size: 2rem;
            color: #a0a0a0;
            text-align: center;
        }

        .bottom-space {
            margin-bottom: 2cm;
        }

        .author {
            font-size: 0.8rem;
            font-weight: 500;
            color: #666;
        }

        /* Buttons */
        .button-start {
            background-color: #A72920;
            color: #fff;
            justify-content: center;
            padding: 12px 20px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-size: 1.25rem;
            margin-top: 20px;
            width: 80%;
        }

        .button-start:hover {
            background-color: #c34140;
        }

        .button {
            background-color: #A72920;
            color: #fff;
            justify-content: center;
            padding: 12px 20px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-size: 1.25rem;
            transition: background-color 0.3s;
            margin-top: 20px;
            width: 100%;
        }

        .button:hover {
            background-color: #c34140;
        }

        .button:disabled {
            background-color: #aaa;
            cursor: not-allowed;
        }

        /* Quiz */
        .question {
            font-size: 1.5rem;
            font-weight: 300;
            margin-bottom: 20px;
            color: #333;
        }

        .system-label {
            display: inline-block;
            background-color: #A72920;
            color: white;
            border-radius: 50px;
            padding: 8px 25px;
            font-size: 1.25rem;
            font-weight: bold;
            margin-bottom: 25px;
        }

        .calculation-box {
            background-color: #f9f9f9;
            border-radius: 12px;
            padding: 25px 15px;
            margin: 20px 0;
            font-size: 1.35rem;
            line-height: 1.7;
        }

        .calculation-box strong {
            color: #A72920;
        }

        /* Eingabefeld */
        .answer-area {
            margin-top: 25px;
        }

        .answer-label {
            display: block;
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 10px;
        }

        #answer-input {
            width: 70%;
            max-width: 300px;
            padding: 14px 20px;
            border: 2px solid #ddd;
            border-radius: 50px;
            text-align: center;
            font-size: 1.5rem;
            outline: none;
        }

        #answer-input:focus {
            border-color: #A72920;
        }

        #answer-input::-webkit-outer-spin-button,
        #answer-input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        #answer-input[type=number] {
            -moz-appearance: textfield;
        }

        /* WS Checkbox */
        .ws-area {
            margin: 25px auto 10px auto;
            width: 70%;
            max-width: 300px;
            display: flex;
            justify-content: center;
        }

        .ws-label {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            background-color: #f9f9f9;
            border-radius: 50px;
            padding: 12px 25px;
            width: 100%;
            cursor: pointer;
            font-size: 1.25rem;
            font-weight: 600;
            transition: background-color 0.3s;
        }

        .ws-label:hover {
            background-color: #efefef;
        }

        #ws-checkbox {
            width: 24px;
            height: 24px;
            accent-color: #A72920;
            cursor: pointer;
        }

        /* Fortschritt */
        .progress {
            font-size: 1rem;
            color: #666;
            margin-bottom: 20px;
        }

        .info {
            font-size: 1rem;
            font-weight: 500;
            color: #666;
            position: fixed;
            top: 10px;
            left: 10px;
        }

        .timer {
            font-size: 1rem;
            font-weight: 500;
            color: #666;
            position: fixed;
            top: 10px;
            right: 10px;
        }

        /* Ergebnis */
        #result-screen {
            text-align: center;
        }

        .result-number {
            font-size: 3rem;
            font-weight: bold;
            color: #A72920;
            margin: 20px 0;
        }

        /* Snackbar */
        #snackbar {
            visibility: hidden;
            min-width: 250px;
            margin-left: -125px;
            background-color: #008754;
            color: #fff;
            text-align: center;
            border-radius: 50px;
            padding: 16px;
            position: fixed;
            z-index: 100;
            left: 50%;
            bottom: 80px;
            font-size: 1.5rem;
        }

        #snackbar.show {
            visibility: visible;
            -webkit-animation: fadein 0.25s, fadeout 0.25s 0.75s;
            animation: fadein 0.25s, fadeout 0.25s 0.75s;
        }

        #snackbar.error {
            background-color: #A72920;
        }

        @-webkit-keyframes fadein {
            from {
                bottom: 0;
                opacity: 0;
            }

            to {
                bottom: 80px;
                opacity: 1;
            }
        }

        @keyframes fadein {
            from {
                bottom: 0;
                opacity: 0;
            }

            to {
                bottom: 80px;
                opacity: 1;
            }
        }

        @-webkit-keyframes fadeout {
            from {
                bottom: 80px;
                opacity: 1;
            }

            to {
                bottom: 0;
                opacity: 0;
            }
        }

        @keyframes fadeout {
            from {
                bottom: 80px;
                opacity: 0;
            }

            to {
                bottom: 0;
                opacity: 0;
            }
        }

        /* Medienabfragen */
        @media (max-width: 800px) {
            .container {
                padding: 20px;
            }

            h1 {
                font-size: 3rem;
            }

            h2 {
                font-size: 1.5rem;
            }

            .calculation-box {
                font-size: 1.15rem;
            }

            #answer-input,
            .ws-area {
                width: 90%;
            }
        }
    </style>
</head>

<body>

    <!-- Startbildschirm -->
    <div id="start-screen" class="container">

        <h2>GKDT Station 2</h2>
        <h1>Atemschutz</h1>
        <h2 class="bottom-space">Rückzugsdruck Berechnen</h2>

        <button class="button-start" onclick="startQuiz()">START</button>

        <div class="author" style="margin-top: 90px;">v1.0 &copy; Thomas Schwar</div>

    </div>


    <!-- Quiz -->
    <div id="quiz-screen" class="container">

        <div id="question-counter" class="info">
            Frage 1
        </div>

        <div id="timer" class="timer">
            00:00
        </div>

        <div id="question-container">
            
            <div class="calculation-box">

                <div class="question" id="question-text"></div>

            </div>


            <div class="answer-area">

                <input
                    type="number"
                    id="answer-input"
                    inputmode="numeric"
                    step="1"
                    placeholder="Ergebnis"
                    autocomplete="off"
                >

                <div class="ws-area">

                    <label class="ws-label" for="ws-checkbox">

                        <input
                            type="checkbox"
                            id="ws-checkbox"
                        >

                        <span>WS (Warnsignal)</span>

                    </label>

                </div>

            </div>

        </div>

        <button
            class="button"
            id="check-answer-btn"
            onclick="checkAnswer()">
            Überprüfen
        </button>

        <button
            class="button"
            style="background-color:#666;"
            onclick="finishQuiz()">
            Beenden
        </button>

    </div>


    <!-- Endbildschirm -->
    <div id="result-screen" class="container">

        <h1 class="bottom-space">
            Ergebnis
        </h1>

        <h2 id="correct-answers">
            0 Richtig
        </h2>

        <h2 id="wrong-answers" style="margin-top: 15px;">
            0 Falsch
        </h2>

        <h2 class="bottom-space" id="time-taken" style="margin-top: 15px;">
            Zeit: 00:00
        </h2>

        <button
            class="button"
            onclick="restartQuiz()">
            Zurück
        </button>

    </div>


    <!-- Snackbar -->
    <div id="snackbar">
        Richtig!
    </div>


    <script>

        /*
         * ============================================
         * RÜCKZUGSDRUCK RECHENQUIZ
         * ============================================
         */

        // Werte für das 300-bar-System
        const startPressures300 = [
            310, 305, 300, 295, 290,
            285, 280, 275, 270
        ];

        const deductions300 = [
            30, 40, 50, 60, 70, 80, 90
        ];


        // Werte für das 200-bar-System
        const startPressures200 = [
            220, 215, 210, 205, 200,
            195, 190, 185, 180
        ];

        const deductions200 = [
            10, 15, 20, 25, 30,
            35, 40, 50, 60
        ];


        // Quizvariablen
        let currentQuestion = 0;
        let correctAnswers = 0;
        let wrongAnswers = 0;

        let currentStartPressure = 0;
        let currentFirePressure = 0;
        let currentCorrectAnswer = 0;
        let currentWsRequired = false;

        let quizRunning = false;
        let startTime = 0;
        let timerInterval = null;


        /*
         * ============================================
         * QUIZ STARTEN
         * ============================================
         */

        function startQuiz() {

            currentQuestion = 0;
            correctAnswers = 0;
            wrongAnswers = 0;

            quizRunning = true;

            document.getElementById("start-screen").style.display = "none";
            document.getElementById("result-screen").style.display = "none";
            document.getElementById("quiz-screen").style.display = "block";

            startTime = Date.now();

            startTimer();

            showNextQuestion();
        }


        /*
         * ============================================
         * TIMER
         * ============================================
         */

        function startTimer() {

            clearInterval(timerInterval);

            timerInterval = setInterval(function () {

                if (!quizRunning) {
                    return;
                }

                const elapsed =
                    Math.floor((Date.now() - startTime) / 1000);

                document.getElementById("timer").textContent =
                    formatTime(elapsed);

            }, 1000);
        }


        function formatTime(seconds) {

            const minutes = Math.floor(seconds / 60);
            const secs = seconds % 60;

            return (
                String(minutes).padStart(2, "0") +
                ":" +
                String(secs).padStart(2, "0")
            );
        }


        /*
         * ============================================
         * ZUFALLSWERT
         * ============================================
         */

        function randomElement(array) {

            return array[
                Math.floor(Math.random() * array.length)
            ];
        }


        /*
         * ============================================
         * NÄCHSTE FRAGE
         * ============================================
         *
         * Frage 1 = 300 bar
         * Frage 2 = 200 bar
         * Frage 3 = 300 bar
         * usw.
         */

        function showNextQuestion() {

            currentQuestion++;

            const is300Bar =
                currentQuestion % 2 === 1;


            let deduction;


            if (is300Bar) {

                currentStartPressure =
                    randomElement(startPressures300);

                deduction =
                    randomElement(deductions300);

            } else {

                currentStartPressure =
                    randomElement(startPressures200);

                deduction =
                    randomElement(deductions200);
            }


            // Druck beim Erreichen des Brandherdes
            currentFirePressure =
                currentStartPressure - deduction;


            // Rückzugsdruck
            currentCorrectAnswer =
                (currentStartPressure - currentFirePressure) * 2;


            // Warnsignal erforderlich?
            currentWsRequired =
                currentCorrectAnswer <= 50;


            /*
             * Anzeige
             */

            document.getElementById("question-counter").textContent =
                "Frage " + currentQuestion;


            document.getElementById("question-text").textContent =
            "Ein Trupp beginnt mit " +
            currentStartPressure +
            " bar einen Innenangriff zur Brandbekämpfung. Nach 9 Minuten meldet der Atemschutz-Truppführer: \"Brandherd erreicht, beginnen Brandbekämpfung, Flaschendruck: " +
            currentFirePressure +
            " bar\". Bei welchem Flaschendruck tritt der Trupp den Rückzug an?";


            /*
             * Eingaben zurücksetzen
             */

            const input =
                document.getElementById("answer-input");

            const checkbox =
                document.getElementById("ws-checkbox");

            input.value = "";
            checkbox.checked = false;

            input.disabled = false;
            checkbox.disabled = false;

            document.getElementById("check-answer-btn").disabled =
                false;

            input.focus();
        }


        /*
         * ============================================
         * ANTWORT PRÜFEN
         * ============================================
         */

        function checkAnswer() {

            const input =
                document.getElementById("answer-input");

            const checkbox =
                document.getElementById("ws-checkbox");


            if (input.value.trim() === "") {

                showSnackbar(
                    "Bitte Ergebnis eingeben!",
                    true
                );

                input.focus();

                return;
            }


            const userAnswer =
                Number(input.value);

            const userWs =
                checkbox.checked;


            const numberCorrect =
                userAnswer === currentCorrectAnswer;

            const wsCorrect =
                userWs === currentWsRequired;


            const answerCorrect =
                numberCorrect && wsCorrect;


            if (answerCorrect) {

                correctAnswers++;

                showSnackbar(
                    "Richtig!",
                    false
                );

            } else {

                wrongAnswers++;

                showSnackbar(
                    "Falsch!",
                    true
                );
            }


            /*
             * Eingaben kurz sperren,
             * damit nicht mehrfach geklickt wird.
             */

            input.disabled = true;
            checkbox.disabled = true;

            document.getElementById("check-answer-btn").disabled =
                true;


            /*
             * Nach der Snackbar automatisch
             * zur nächsten Frage.
             */

            setTimeout(function () {

                if (quizRunning) {
                    showNextQuestion();
                }

            }, 1100);
        }


        /*
         * ============================================
         * SNACKBAR
         * ============================================
         */

        function showSnackbar(message, error) {

            const snackbar =
                document.getElementById("snackbar");

            snackbar.textContent = message;

            snackbar.classList.remove("error");

            if (error) {
                snackbar.classList.add("error");
            }

            snackbar.classList.add("show");


            setTimeout(function () {

                snackbar.classList.remove("show");

            }, 1000);
        }


        /*
         * ============================================
         * ENTER-TASTE
         * ============================================
         */

        document.getElementById("answer-input")
            .addEventListener("keydown", function(event) {

                if (event.key === "Enter") {

                    event.preventDefault();

                    checkAnswer();
                }

            });


        /*
         * ============================================
         * QUIZ BEENDEN
         * ============================================
         */

        function finishQuiz() {

            quizRunning = false;

            clearInterval(timerInterval);


            const elapsed =
                Math.floor((Date.now() - startTime) / 1000);


            document.getElementById("quiz-screen").style.display =
                "none";

            document.getElementById("result-screen").style.display =
                "block";


            document.getElementById("correct-answers").textContent =
                "Richtig beantwortet: " + correctAnswers;


            document.getElementById("wrong-answers").textContent =
                "Falsch beantwortet: " + wrongAnswers;


            document.getElementById("time-taken").textContent =
                "Zeit: " + formatTime(elapsed);
        }


        /*
         * ============================================
         * ZURÜCK ZUM STARTBILDSCHIRM
         * ============================================
         */

        function restartQuiz() {

            clearInterval(timerInterval);

            quizRunning = false;

            document.getElementById("result-screen").style.display =
                "none";

            document.getElementById("quiz-screen").style.display =
                "none";

            document.getElementById("start-screen").style.display =
                "block";

            document.getElementById("timer").textContent =
                "00:00";
        }

    </script>

</body>
</html>
